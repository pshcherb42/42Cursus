listen=YES
listen_ipv6=NO

# Disable anonymous access
anonymous_enable=NO

# Allow local users to log in
local_enable=YES

# Allow file uploads
write_enable=YES

# Chroot users to their home directory
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode port range (must match EXPOSE and docker-compose ports)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

# Use the container's IP for passive mode
pasv_address_enable=NO

# Log file
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log

# Security
seccomp_sandbox=NO